<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de cronogramas</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <h1>Generador de cronogramas</h1>
  <p class="subtitulo">Versión 2 · Datos generales y festivos</p>

    <form id="formulario">
    <div class="campo">
      <label for="nombreCurso">Nombre del curso</label>
      <input type="text" id="nombreCurso" placeholder="Ej: Curso de jardinería 2026" required>
    </div>

    <div class="fila">
      <div class="campo">
        <label for="fechaInicio">Fecha de inicio</label>
        <input type="date" id="fechaInicio" required>
      </div>
      <div class="campo">
        <label for="fechaFin">Fecha de fin</label>
        <input type="date" id="fechaFin" required>
      </div>
    </div>

    <div class="fila">
      <div class="campo">
        <label for="horasDia">Horas al día</label>
        <input type="number" id="horasDia" min="1" max="12" value="6" required>
      </div>
      <div class="campo">
        <label for="horario">Horario</label>
        <input type="text" id="horario" placeholder="Ej: 15:00 a 21:00" required>
      </div>
    </div>

    <div class="festivos-bloque">
      <h3>Días festivos / no lectivos</h3>
      <div class="festivos-entrada">
        <input type="date" id="inputFestivo">
        <button type="button" class="btn-secundario" id="btnAnadirFestivo">Añadir festivo</button>
      </div>
      <ul class="lista-festivos" id="listaFestivos"></ul>
    </div>

    <button type="submit">Generar calendario</button>
    <div id="mensajeError" class="error"></div>
  </form>

  <div id="resultado"></div>

  <script src="js/app.js"></script>
</body>
</html>
